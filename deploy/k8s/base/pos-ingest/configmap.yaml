# Poll/retry tuning and the venues-config mount path are specific to pos-ingest; nothing else
# reads them, so they stay local instead of in configmap-common.yaml. The venues.json content
# itself is a separate ConfigMap generated by configMapGenerator in the root kustomization.yaml
# (see pos-ingest/venues.json), mounted as a volume — POS_VENUES_CONFIG below just points at it.
apiVersion: v1
kind: ConfigMap
metadata:
  name: pos-ingest-config
  namespace: clearpath
data:
  POS_MAX_CONCURRENCY: "5"
  POS_POLL_INTERVAL: "30s"
  POS_MAX_RETRIES: "4"
  POS_RETRY_BASE_DELAY: "200ms"
  POS_RETRY_MAX_DELAY: "10s"
  POS_VENUES_CONFIG: "/app/venues.json"
