# NodePort is a fallback for kind clusters configured with extraPortMappings (out of scope here).
# The primary documented access path is:
#   kubectl port-forward -n clearpath svc/merchant-web 5173:8080
# then open http://localhost:5173 — this matches docker-compose's 5173:8080 mapping so a
# developer's muscle memory of "open localhost:5173" still works.
apiVersion: v1
kind: Service
metadata:
  name: merchant-web
  namespace: clearpath
  labels:
    app: merchant-web
spec:
  type: NodePort
  selector:
    app: merchant-web
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30080
