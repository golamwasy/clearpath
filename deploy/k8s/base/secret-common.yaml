# DB URLs/credentials and the Mongo URI, as a Secret so they aren't sitting in plain ConfigMaps.
# Values are plaintext here and match docker-compose's (e.g. menu/menu) only because this is a
# local, disposable kind demo with no real secrets. A real deployment would source these from a
# secret manager (e.g. Vault, cloud KMS-backed secret store, sealed-secrets) — never from a
# Secret manifest committed to the repo like this one.
apiVersion: v1
kind: Secret
metadata:
  name: clearpath-secrets
  namespace: clearpath
type: Opaque
stringData:
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "postgres"
  MENU_DB_URL: "jdbc:postgresql://postgres:5432/menu"
  MENU_DB_USER: "menu"
  MENU_DB_PASSWORD: "menu"
  AVAILABILITY_DB_URL: "jdbc:postgresql://postgres:5432/availability"
  AVAILABILITY_DB_USER: "availability"
  AVAILABILITY_DB_PASSWORD: "availability"
  POS_DB_URL: "postgres://pos_ingest:pos_ingest@postgres:5432/pos_ingest"
  MONGO_URI: "mongodb://mongo:27017"
