server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        # SPA fallback: react-router owns client-side routing, nginx just serves index.html for
        # any path it doesn't have a static file for.
        try_files $uri $uri/ /index.html;
    }
}
