services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./docker/postgres-init.sh:/docker-entrypoint-initdb.d/postgres-init.sh
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.8.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 5s
      timeout: 5s
      retries: 10

  menu-service:
    build:
      context: .
      dockerfile: menu-service/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      MENU_DB_URL: jdbc:postgresql://postgres:5432/menu
      MENU_DB_USER: menu
      MENU_DB_PASSWORD: menu
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MENU_EVENTS_TOPIC: menu.events
      SYSTEM_TRACE_TOPIC: system.trace
      MENU_HTTP_PORT: "8081"
      CORS_ALLOWED_ORIGIN_HOST: "localhost:5173"

  availability-service:
    build:
      context: .
      dockerfile: availability-service/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8082:8082"
    environment:
      AVAILABILITY_DB_URL: jdbc:postgresql://postgres:5432/availability
      AVAILABILITY_DB_USER: availability
      AVAILABILITY_DB_PASSWORD: availability
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MENU_EVENTS_TOPIC: menu.events
      SYSTEM_TRACE_TOPIC: system.trace
      AVAILABILITY_CONSUMER_GROUP: availability-service
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      MONGO_URI: mongodb://mongo:27017
      MONGO_DATABASE: availability
      AVAILABILITY_HTTP_PORT: "8082"
      CORS_ALLOWED_ORIGIN_HOST: "localhost:5173"
      # This repo has no production deployment — see docs/adr/0005-observability-ui.md.
      CHAOS_ENABLED: "true"

  trace-collector:
    build:
      context: .
      dockerfile: trace-collector/Dockerfile
    depends_on:
      kafka:
        condition: service_healthy
      mongo:
        condition: service_healthy
    ports:
      - "8084:8084"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SYSTEM_TRACE_TOPIC: system.trace
      TRACE_COLLECTOR_CONSUMER_GROUP: trace-collector
      MONGO_URI: mongodb://mongo:27017
      MONGO_DATABASE: tracing
      TRACE_COLLECTOR_HTTP_PORT: "8084"
      CORS_ALLOWED_ORIGIN_HOST: "localhost:5173"
      MONITORED_CONSUMER_GROUPS: "availability-service:menu.events,trace-collector:system.trace"

  storefront-api:
    build:
      context: .
      dockerfile: storefront-api/Dockerfile
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      menu-service:
        condition: service_started
      availability-service:
        condition: service_started
    ports:
      - "8085:8085"
    environment:
      MENU_SERVICE_URL: http://menu-service:8081
      AVAILABILITY_SERVICE_URL: http://availability-service:8082
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SYSTEM_TRACE_TOPIC: system.trace
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      STOREFRONT_MENU_CACHE_TTL_SECONDS: "5"
      STOREFRONT_HTTP_PORT: "8085"
      CORS_ALLOWED_ORIGIN_HOST: "localhost:5173"

  nested-pos:
    build:
      context: .
      dockerfile: mocks/nested-pos/Dockerfile
    ports:
      - "9001:9001"
    environment:
      PORT: "9001"
      FAIL_EVERY_N: "7"
      DELAY_MS: "50"

  flat-pos:
    build:
      context: .
      dockerfile: mocks/flat-pos/Dockerfile
    ports:
      - "9002:9002"
    environment:
      PORT: "9002"
      FAIL_EVERY_N: "7"
      DELAY_MS: "50"

  pos-ingest:
    build:
      context: .
      dockerfile: pos-ingest/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      nested-pos:
        condition: service_started
      flat-pos:
        condition: service_started
    ports:
      - "8083:8083"
    environment:
      POS_DB_URL: postgres://pos_ingest:pos_ingest@postgres:5432/pos_ingest
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      POS_SYNC_TOPIC: pos.sync
      POS_SYNC_DLQ_TOPIC: pos.sync.dlq
      SYSTEM_TRACE_TOPIC: system.trace
      POS_HTTP_PORT: "8083"
      CORS_ALLOWED_ORIGIN: "http://localhost:5173"
      POS_MAX_CONCURRENCY: "5"
      POS_POLL_INTERVAL: 30s
      POS_MAX_RETRIES: "4"
      POS_RETRY_BASE_DELAY: 200ms
      POS_RETRY_MAX_DELAY: 10s
      POS_VENUES_CONFIG: /app/venues.json
      # This repo has no production deployment — see docs/adr/0005-observability-ui.md.
      CHAOS_ENABLED: "true"
    volumes:
      - ./pos-ingest/venues.json:/app/venues.json:ro

  merchant-web:
    build:
      context: .
      dockerfile: merchant-web/Dockerfile
      # Vite bakes these in at build time; they point at the *host*-visible ports (matching this
      # file's own port mappings below), since the browser running the built JS talks to
      # localhost, not the docker-compose network.
      args:
        VITE_MENU_API_URL: http://localhost:8081
        VITE_AVAILABILITY_API_URL: http://localhost:8082
        VITE_POS_API_URL: http://localhost:8083
        VITE_TRACE_API_URL: http://localhost:8084
    depends_on:
      - menu-service
      - availability-service
      - pos-ingest
      - trace-collector
    ports:
      - "5173:8080"

  prometheus:
    image: prom/prometheus:v2.55.1
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:11.2.0
    ports:
      - "3000:3000"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus

volumes:
  postgres-data:
