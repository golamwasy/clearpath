name: merchant-web

on:
  push:
    paths:
      - "merchant-web/**"
      - "*/openapi.yaml"
      - ".github/workflows/merchant-web.yml"
  pull_request:
    paths:
      - "merchant-web/**"
      - "*/openapi.yaml"
      - ".github/workflows/merchant-web.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: merchant-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: merchant-web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx vitest run

  # Playwright e2e against the real backend stack (docker-compose), per
  # docs/plan-phase4.md section 5 — both specs reload the page and assert
  # against server state (Postgres / Redis), not just the client cache, so
  # they need the actual services running, not a mock.
  #
  # This job is best-effort: it was written by reading docker-compose.yml
  # (service names: postgres, redis, mongo, kafka, menu-service,
  # availability-service, pos-ingest) but has not been run against a real
  # GitHub Actions runner as part of this change, so treat a first failure
  # here as "the compose wiring needs a tweak," not "the frontend is
  # broken" — the build job above is the one that has been verified.
  e2e:
    runs-on: ubuntu-latest
    needs: build
    defaults:
      run:
        working-directory: merchant-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: merchant-web/package-lock.json

      - name: Start backend stack
        working-directory: .
        run: docker compose up -d postgres redis mongo kafka menu-service availability-service pos-ingest

      - name: Wait for services to be ready
        run: |
          for url in http://localhost:8081/ready http://localhost:8082/ready http://localhost:8083/ready; do
            echo "Waiting for $url"
            for i in $(seq 1 60); do
              if curl -sf "$url" > /dev/null; then
                echo "$url is ready"
                break
              fi
              if [ "$i" -eq 60 ]; then
                echo "$url did not become ready in time"
                exit 1
              fi
              sleep 2
            done
          done

      - run: npm ci
      - run: npm run gen:api
      - run: npx playwright install --with-deps chromium
      - run: npm run build

      - name: Serve built app
        run: npx vite preview --port 5173 &

      - name: Wait for merchant-web to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5173 > /dev/null; then break; fi
            sleep 1
          done

      - name: Run Playwright e2e specs
        env:
          MERCHANT_WEB_URL: http://localhost:5173
          MENU_API_URL: http://localhost:8081
          CI: "true"
        run: npm run test:e2e

      - name: Dump backend logs on failure
        if: failure()
        working-directory: .
        run: docker compose logs menu-service availability-service pos-ingest

      - name: Tear down backend stack
        if: always()
        working-directory: .
        run: docker compose down -v
